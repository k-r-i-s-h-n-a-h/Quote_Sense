name: Cleanup comparison sessions

on:
  schedule:
    # Daily 03:30 UTC (09:00 IST)
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Delete quotes applied more than N days ago"
        required: false
        default: "7"
      dry_run:
        description: "Preview only (true/false)"
        required: false
        default: "false"

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install supabase python-dotenv

      - name: Run cleanup script
        working-directory: backend
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          ARGS="--days ${{ github.event.inputs.days || '7' }}"
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/cleanup_comparison_sessions.py $ARGS

name: Deploy to Vercel (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vercel-dev
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      # ----------------------------------------------------------
      # TEMPORARILY DISABLED — focus on feature work; re-enable later
      # to pass Sonar quality gate + coverage before tightening CI.
      # Tests kept in repo: frontend/lib/__tests__/ (e.g. sonar-gates).
      # ----------------------------------------------------------
      # - name: Run frontend unit tests with coverage
      #   working-directory: ./frontend
      #   run: npm run test:coverage

      # Deploy first so Vercel is not blocked when SonarQube is down or QG fails.
      - name: Install Vercel CLI
        # Pin a published CLI (47.2.2 never existed on npm).
        run: npm install --global vercel@58.9.0

      # Deploy FROM frontend/ so Next sees app/ here.
      # Do NOT set Vercel dashboard Root Directory to "frontend" with this
      # pattern (that would resolve frontend/frontend). Token cannot PATCH
      # project settings (forbidden), so we avoid the API rootDirectory call.
      - name: Sync Tatva API URL on Vercel
        working-directory: ./frontend
        run: |
          # production only — preview env add can prompt for git branch in CI
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true

      # Prebuilt + explicit alias: plain `vercel deploy --prod` was leaving
      # devquotesense stuck on an old production deployment (same dpl/etag).
      - name: Deploy to Vercel (prebuilt + alias)
        working-directory: ./frontend
        run: |
          set -euo pipefail
          test -d app
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          echo "Deploy target projectId=${VERCEL_PROJECT_ID} orgId=${VERCEL_ORG_ID}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"
          URL="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.out | tail -n 1)"
          echo "Production deploy URL: ${URL}"
          test -n "${URL}"
          vercel alias set "${URL}" devquotesense.withtatva.ai --token="$VERCEL_TOKEN" --scope="${VERCEL_ORG_ID}"
          echo "Aliased devquotesense.withtatva.ai -> ${URL}"


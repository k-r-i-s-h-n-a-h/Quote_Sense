name: Deploy to Vercel (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vercel-dev
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      #- name: Normalize commit author to the Vercel account
       # run: |
       #   git config user.email "infrawithtatva@gmail.com"
       #   git config user.name "infra-9507"
       #   git commit --amend --no-edit --reset-author

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      # ==========================================================
      # SONARQUBE CODE ANALYSIS
      # The application source code is inside the frontend folder.
      # Coverage comes from vitest (lcov) so Sonar is not stuck at 0%.
      # ==========================================================
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=Quotesense-Dev
            -Dsonar.projectName=Quotesense-Dev
            -Dsonar.sources=.
            -Dsonar.tests=lib/__tests__
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=node_modules/**,.next/**,.vercel/**,coverage/**,dist/**,build/**,public/**,**/*.test.ts,**/*.test.tsx,vitest.config.ts
            -Dsonar.coverage.exclusions=app/**,components/**,lib/auth.tsx,lib/download-comparison-pdf.ts,lib/compare-lane.ts,lib/compare-payload-cache.ts,lib/compare-progress.ts,lib/compare-sync.ts,lib/feature-flags.ts,lib/project-api.ts,lib/project-resolve.ts,lib/tatva-api.ts,lib/tatva-ecosystem.ts,lib/tatva-services.ts
            -Dsonar.cpd.exclusions=app/**,components/**,lib/auth.tsx

      # ==========================================================
      # SONARQUBE QUALITY GATE
      # Deployment stops here if the Quality Gate fails.
      # ==========================================================
      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Show SonarQube Quality Gate Status
        run: |
          echo "Quality Gate status: ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"

      - name: Install Vercel CLI
        # Align with Vercel API requirement (>= 47.2.2); pin for reproducible CI.
        run: npm install --global vercel@47.2.2

      - name: Sync Tatva API URL on Vercel
        working-directory: ./frontend
        run: |
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE preview --token=$VERCEL_TOKEN --force || true

      - name: Deploy to Vercel
        working-directory: ./frontend
        run: vercel deploy --prod --yes --token=$VERCEL_TOKEN

name: Deploy to Vercel (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vercel-dev
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      # ----------------------------------------------------------
      # TEMPORARILY DISABLED — focus on feature work; re-enable later
      # to pass Sonar quality gate + coverage before tightening CI.
      # Tests kept in repo: frontend/lib/__tests__/ (e.g. sonar-gates).
      # ----------------------------------------------------------
      # - name: Run frontend unit tests with coverage
      #   working-directory: ./frontend
      #   run: npm run test:coverage

      # Deploy first so Vercel is not blocked when SonarQube is down or QG fails.
      - name: Install Vercel CLI
        # Pin a published CLI (47.2.2 never existed on npm).
        run: npm install --global vercel@58.9.0

      # Monorepo: Next app lives in frontend/. Without this, Vercel builds at repo
      # root and fails with "Couldn't find any pages or app directory".
      - name: Ensure Vercel Root Directory is frontend
        run: |
          set -euo pipefail
          curl -sS -X PATCH \
            "https://api.vercel.com/v9/projects/${VERCEL_PROJECT_ID}?teamId=${VERCEL_ORG_ID}" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"rootDirectory":"frontend"}' \
            | tee /tmp/vercel-project-patch.json
          python3 - <<'PY'
          import json, sys
          data = json.load(open("/tmp/vercel-project-patch.json"))
          root = data.get("rootDirectory")
          if root != "frontend":
              print("Unexpected project payload:", json.dumps(data, indent=2)[:2000])
              sys.exit("Failed to set rootDirectory=frontend")
          print("rootDirectory OK:", root)
          PY

      # Run from monorepo root (not frontend/) so Root Directory is not doubled.
      - name: Sync Tatva API URL on Vercel
        run: |
          # production only — preview env add can prompt for git branch in CI
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true

      - name: Deploy to Vercel
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules frontend/.next
          test -d frontend/app
          vercel deploy --prod --yes --token=$VERCEL_TOKEN


name: Deploy to Vercel (dev)

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: vercel-dev
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_DEV }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      - name: Run frontend unit tests with coverage
        working-directory: ./frontend
        run: npm run test:coverage

      # Deploy first so Vercel is not blocked when SonarQube is down or QG fails.
      - name: Install Vercel CLI
        # Pin a published CLI (47.2.2 never existed on npm).
        run: npm install --global vercel@58.9.0

      # Root Directory on the Vercel project is "frontend" — run CLI from monorepo root
      # so it does not resolve to frontend/frontend.
      - name: Sync Tatva API URL on Vercel
        run: |
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE preview --token=$VERCEL_TOKEN --force || true

      - name: Deploy to Vercel
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules frontend/.next
          test -d frontend
          vercel deploy --prod --yes --token=$VERCEL_TOKEN

      # ==========================================================
      # SONARQUBE (non-blocking): host timeouts must not fail deploy.
      # Build+tests already gate quality locally; Sonar reports when reachable.
      # ==========================================================
      - name: SonarQube Scan
        id: sonar-scan
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.projectKey=Quotesense-Dev
            -Dsonar.projectName=Quotesense-Dev
            -Dsonar.sources=lib
            -Dsonar.tests=lib/__tests__
            -Dsonar.test.inclusions=**/*.test.ts,**/*.test.tsx
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx,lib/auth.tsx,lib/download-comparison-pdf.ts,lib/compare-lane.ts,lib/compare-payload-cache.ts,lib/compare-progress.ts,lib/compare-sync.ts,lib/feature-flags.ts,lib/project-api.ts,lib/project-resolve.ts,lib/tatva-api.ts,lib/tatva-ecosystem.ts,lib/tatva-services.ts
            -Dsonar.coverage.exclusions=lib/auth.tsx,lib/download-comparison-pdf.ts,lib/compare-lane.ts,lib/compare-payload-cache.ts,lib/compare-progress.ts,lib/compare-sync.ts,lib/feature-flags.ts,lib/project-api.ts,lib/project-resolve.ts,lib/tatva-api.ts,lib/tatva-ecosystem.ts,lib/tatva-services.ts

      - name: SonarQube Quality Gate Check
        id: sonarqube-quality-gate-check
        if: steps.sonar-scan.outcome == 'success'
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        with:
          pollingTimeoutSec: 300
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Show SonarQube status
        if: always()
        run: |
          echo "Sonar scan outcome: ${{ steps.sonar-scan.outcome }}"
          echo "Quality Gate status: ${{ steps.sonarqube-quality-gate-check.outputs.quality-gate-status }}"
          if [ "${{ steps.sonar-scan.outcome }}" != "success" ]; then
            echo "Sonar host unreachable or scan failed — Vercel deploy already completed."
          fi

name: Deploy to Vercel (test)

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: vercel-test
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TEST }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CI: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      - name: Install Vercel CLI
        # Pin a published version (reproducible CI; --yes required non-interactive).
        run: npm install --global vercel@58.9.0

      # Project Settings → Root Directory = "frontend".
      # Deploy/env commands MUST run from the monorepo root (not ./frontend),
      # otherwise Vercel resolves to frontend/frontend and fails.
      - name: Sync Tatva API + QA backend URL on Vercel
        run: |
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE preview --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add NEXT_PUBLIC_BACKEND_URL production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add NEXT_PUBLIC_BACKEND_URL preview --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add BACKEND_URL production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add BACKEND_URL preview --token=$VERCEL_TOKEN --force || true

      - name: Deploy to Vercel (production)
        id: vercel_deploy
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Avoid shipping local build artifacts; Vercel builds from Root Directory.
          rm -rf frontend/node_modules frontend/.next
          echo "Commit: ${GITHUB_SHA}"
          echo "Cwd: $(pwd)  (expect monorepo root; Root Directory=frontend on project)"
          test -d frontend || { echo "missing frontend/ at repo root"; exit 1; }
          # --prod assigns production aliases of the linked Vercel project
          DEPLOY_URL=$(vercel deploy --prod --yes --token="$VERCEL_TOKEN")
          echo "Deploy URL: ${DEPLOY_URL}"
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          vercel inspect "$DEPLOY_URL" --token="$VERCEL_TOKEN" || true

      - name: Alias note
        run: |
          echo "If testquotesense.withtatva.ai does not show dual badges after this run:"
          echo "  1) Vercel → tatvaops-quotesense-qa → Deployments → this commit"
          echo "  2) Confirm Production domain is attached to THAT deployment"
          echo "  3) Network headers: X-Quote-Ui-Status: dual-badge"
          echo "Deployed: ${{ steps.vercel_deploy.outputs.url }}"

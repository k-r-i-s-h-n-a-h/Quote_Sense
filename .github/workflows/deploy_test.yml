name: Deploy to Vercel (test)

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: vercel-test
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TEST }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CI: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      - name: Install Vercel CLI
        # 47.2.2 never existed on npm (ETARGET). Pin a published CLI like dev.
        # Always pass --yes so non-interactive runs do not hang on prod confirm.
        run: npm install --global vercel@58.9.0

      # QA project Root Directory is "frontend" (dashboard). Deploy from monorepo
      # root so Vercel resolves frontend/ once — NOT from frontend/ (that becomes
      # frontend/frontend). Dev project uses ./ so deploy_dev.yml differs.
      # Skip preview env add — CLI can prompt for git branch in CI.
      - name: Sync Tatva API + QA backend URL on Vercel
        run: |
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add NEXT_PUBLIC_BACKEND_URL production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add BACKEND_URL production --token=$VERCEL_TOKEN --force || true

      - name: Deploy to Vercel
        timeout-minutes: 10
        run: |
          set -euo pipefail
          rm -rf frontend/node_modules frontend/.next
          test -d frontend/app
          echo "Starting vercel deploy (non-interactive)…"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          echo "Vercel deploy finished."

name: Deploy to Vercel (test)

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: vercel-test
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TEST }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CI: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      - name: Install Vercel CLI
        # Same pin as deploy_dev.yml
        run: npm install --global vercel@58.9.0

      # Same cwd as deploy_dev.yml (./frontend). Keep QA backend env sync.
      - name: Sync Tatva API + QA backend URL on Vercel
        working-directory: ./frontend
        run: |
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add NEXT_PUBLIC_BACKEND_URL production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add BACKEND_URL production --token=$VERCEL_TOKEN --force || true

      # Same prebuilt flow as deploy_dev.yml. After pull, clear rootDirectory so
      # QA (dashboard Root Directory=frontend) does not resolve frontend/frontend
      # or upload broken monorepo traces for node_modules.
      - name: Deploy to Vercel (prebuilt)
        working-directory: ./frontend
        run: |
          set -euo pipefail
          test -d app
          mkdir -p .vercel
          printf '%s\n' "{\"orgId\":\"${VERCEL_ORG_ID}\",\"projectId\":\"${VERCEL_PROJECT_ID}\"}" > .vercel/project.json
          echo "Deploy target projectId=${VERCEL_PROJECT_ID} orgId=${VERCEL_ORG_ID}"
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path(".vercel/project.json")
          data = json.loads(path.read_text())
          settings = data.get("settings")
          if isinstance(settings, dict):
              settings["rootDirectory"] = None
          data["rootDirectory"] = None
          path.write_text(json.dumps(data, indent=2) + "\n")
          print("Cleared rootDirectory in .vercel/project.json (match Dev project ./)")
          PY
          vercel build --prod --token="$VERCEL_TOKEN"
          URL="$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" | tee /tmp/vercel-deploy.out | tail -n 1)"
          echo "Production deploy URL: ${URL}"
          test -n "${URL}"
          grep -E 'Aliased|Production|Ready' /tmp/vercel-deploy.out || true

name: Deploy to Vercel (test)

on:
  push:
    branches: [test]
  workflow_dispatch:

concurrency:
  group: vercel-test
  cancel-in-progress: false

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_TEST }}
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  CI: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Verify production build
        working-directory: ./frontend
        run: npm run build

      - name: Install Vercel CLI
        # Vercel API requires CLI >= 47.2.2; keep a pin (not @latest) for CI stability.
        # Always pass --yes so non-interactive runs do not hang on prod confirm.
        run: npm install --global vercel@47.2.2

      # QA project Root Directory = "frontend" → run vercel from repo root.
      # --yes is mandatory in CI (no TTY); otherwise deploy waits forever.
      - name: Sync Tatva API + QA backend URL on Vercel
        run: |
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://devopsapi.withtatva.ai' | vercel env add TATVA_API_BASE preview --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add NEXT_PUBLIC_BACKEND_URL production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add NEXT_PUBLIC_BACKEND_URL preview --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add BACKEND_URL production --token=$VERCEL_TOKEN --force || true
          printf '%s' 'https://tatvaops-quotesense-qa.onrender.com' | vercel env add BACKEND_URL preview --token=$VERCEL_TOKEN --force || true

      - name: Deploy to Vercel
        timeout-minutes: 10
        run: |
          set -euo pipefail
          # Drop local install/build so upload does not walk huge trees.
          rm -rf frontend/node_modules frontend/.next
          echo "Starting vercel deploy (non-interactive)…"
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
          echo "Vercel deploy finished."

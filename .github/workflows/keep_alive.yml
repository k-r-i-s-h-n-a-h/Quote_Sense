name: Wake Up Render

on:
  schedule:
    # Quota-friendly: ping every 14 min ONLY during business hours on weekdays.
    # 03:00-15:00 UTC ≈ 08:30-20:30 IST. This keeps Render's free tier awake
    # while people actually use the app, without burning Actions minutes
    # overnight or on weekends (the reason a 24x7 cron was removed before).
    - cron: '*/14 3-15 * * 1-5'
  # Lets you trigger a wake-up manually from the Actions tab.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -I https://tatvaops-quotesense.onrender.com/api/health | grep "HTTP"
          echo "Backend pinged successfully at $(date)"

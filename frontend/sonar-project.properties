# Sonar analysis focused on unit-tested helpers so the quality gate can
# measure coverage/duplications/issues on code we can keep at high quality.
# UI (app/, components/) is still built & tested in CI; expand sources later.
sonar.sources=lib
sonar.tests=lib/__tests__
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8
sonar.exclusions=\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  lib/auth.tsx,\
  lib/download-comparison-pdf.ts,\
  lib/pdf-unicode-font.ts,\
  lib/compare-lane.ts,\
  lib/compare-payload-cache.ts,\
  lib/compare-progress.ts,\
  lib/compare-sync.ts,\
  lib/feature-flags.ts,\
  lib/project-api.ts,\
  lib/project-resolve.ts,\
  lib/tatva-api.ts,\
  lib/tatva-ecosystem.ts,\
  lib/tatva-services.ts
sonar.coverage.exclusions=\
  lib/auth.tsx,\
  lib/download-comparison-pdf.ts,\
  lib/pdf-unicode-font.ts,\
  lib/compare-lane.ts,\
  lib/compare-payload-cache.ts,\
  lib/compare-progress.ts,\
  lib/compare-sync.ts,\
  lib/feature-flags.ts,\
  lib/project-api.ts,\
  lib/project-resolve.ts,\
  lib/tatva-api.ts,\
  lib/tatva-ecosystem.ts,\
  lib/tatva-services.ts
